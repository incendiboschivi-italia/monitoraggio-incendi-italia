<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio Incendi Italia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #111; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; bottom: 20px; left: 20px; 
            background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 8px;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px;
            color: #333; line-height: 1.4;
        }
        .info-box h4 { margin: 0 0 8px 0; color: #d9534f; font-size: 15px; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box">
        <h4>Anomalie Termiche Italia (24h)</h4>
        <p>Fonte dati: <b>NASA FIRMS</b><br>Satelliti MODIS e VIIRS</p>
        <p><span style="color:red; font-size: 16px;">●</span> Hotspot (Punto caldo rilevato)</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializza la mappa centrata sull'Italia
        const map = L.map('map').setView([42.5, 12.5], 6);

        // Carica la mappa di sfondo (OpenStreetMap scura, adatta agli incendi)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO'
        }).addTo(map);

        // Carica i dati dal file scaricato in automatico dal nostro robot
        fetch('./incendi.json')
            .then(response => {
                if (!response.ok) throw new Error("Dati non ancora pronti");
                return response.json();
            })
            .then(data => {
                data.forEach(incendio => {
                    const lat = parseFloat(incendio.latitude);
                    const lon = parseFloat(incendio.longitude);
                    
                    if (!isNaN(lat) && !isNaN(lon)) {
                        // Crea un pallino luminoso per ogni anomalia termica
                        L.circleMarker([lat, lon], {
                            radius: 6,
                            color: '#ff4500',
                            fillColor: '#ffcc00',
                            fillOpacity: 0.8,
                            weight: 1.5
                        }).addTo(map)
                        .bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong style="color:red;">Anomalia Termica Rilevata</strong><br>
                                <b>Data:</b> ${incendio.acq_date}<br>
                                <b>Ora (UTC):</b> ${incendio.acq_time.substring(0,2)}:${incendio.acq_time.substring(2,4)}<br>
                                <b>Potenza Termica:</b> ${incendio.frp} MW<br>
                                <small style="color:#777;">Nota: Può includere calore industriale.</small>
                            </div>
                        `);
                    }
                });
            })
            .catch(err => {
                console.log("Mappa pronta. In attesa del primo avvio del robot dei dati...");
            });
    </script>
</body>
</html>
